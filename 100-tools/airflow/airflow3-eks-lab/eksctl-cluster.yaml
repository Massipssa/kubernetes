apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: airflow3-lab
  region: eu-west-3

iam:
  withOIDC: true

managedNodeGroups:
  - name: general
    instanceType: t3.large
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 40
    labels:
      workload: airflow-lab
    tags:
      project: airflow3-lab
      environment: mvp

addons:
  - name: vpc-cni
  - name: kube-proxy
  - name: coredns
