apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: dev
  labels:
    app: nginx
    tier: frontend
  annotations:
    description: Basic nginx pod example
spec:
  restartPolicy: Always
  containers:
    - name: nginx
      image: nginx:1.25
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      env:
        - name: APP_ENV
          value: dev
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      volumeMounts:
        - name: cache
          mountPath: /usr/share/nginx/html/cache
  volumes:
    - name: cache
      emptyDir: {}
