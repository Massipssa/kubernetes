apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx-rc
  namespace: dev
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    app: nginx
    tier: frontend
  template:
    metadata:
      labels:
        app: nginx
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - name: http
              containerPort: 80
